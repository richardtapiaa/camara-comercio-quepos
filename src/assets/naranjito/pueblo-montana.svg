    <path d="M-10 240l0 -90c-3 -9 10 -19 16 -11c-2 -4 6 -10 10 -7c-3 -10 7 -16 14 -9c-1 -7 10 -10 12 -3c4 -9 18 -6 19 4c5 -7 17 -2 16 7c2 -10 14 -9 16 0c-2 -7 7 -12 12 -6c-4 -8 5 -14 12 -9c-4 -11 6 -18 15 -9c0 -10 11 -13 13 -3c2 -5 12 -3 13 2c5 -8 20 -2 18 7c4 -8 17 -3 15 5c6 -8 22 -3 19 7c6 -14 21 -10 20 5c0 -10 13 -11 15 -1c-1 -8 11 -14 17 -9c-2 -8 6 -14 13 -8c-5 -12 7 -19 16 -9c-2 -12 11 -17 16 -6c0 -12 15 -16 20 -5c0 -10 14 -12 17 -2c2 -6 11 -5 12 2c5 -6 21 -1 20 6c3 -7 15 -6 15 2c-4 -12 14 -19 20 -8c-4 -14 11 -20 18 -8c1 -5 14 -4 16 2c6 -10 19 -6 18 6c2 -5 8 -3 7 2l0 146z" stroke="none"/>
    <!-- Loma del pueblo, separada de los montes por una línea blanca -->
    <path d="M-10 312l0 -102c12 -4 45 -22 70 -24c25 -2 53 12 80 10c27 -2 53 -18 80 -20c27 -2 53 11 80 10c27 -1 52 -17 80 -18c28 -1 75 8 90 10l0 134z" stroke="#fff" stroke-width="6"/>
